<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion Dashboard-App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="min-vh-100 d-flex align-items-center justify-content-center p-1 login-page ">
    <section class="card login-card">
      <div class="card-body p-1">
        <div class="brand d-flex align-items-center justify-content-center mb-4">
          <img src="/images/Logo.svg" alt="" style="width: 300px;">
        </div>
       <h1 class="mb-4 text-light">Se connecter</h1>
        <form>
          <div class="mb-4">
            <label for="email" class="form-label text-light">Email</label>
            <input id="email" class="form-control form-control-lg" type="email">
          </div>
          <div class="mb-4">
            <label for="password" class="form-label text-light">Mot de passe</label>
            <input id="password" class="form-control form-control-lg" type="password">
          </div>
          <div class="text-center mb-3">
            <a href="dashboard.html"><div type="submit" class="btn btn-primary btn-lg login-btn text-light">Se Connecter</div></a>
          </div>
          <p class="text-center continue-text mb-3 text-light">ou continuez avec</p>
          <div class="d-flex justify-content-center gap-2 mb-3">
            <button type="button" class="btn social-btn" aria-label="Google"><i class="bi bi-google"></i></button>
            <button type="button" class="btn social-btn" aria-label="GitHub"><i class="bi bi-github"></i></button>
            <button type="button" class="btn social-btn" aria-label="Facebook"><i class="bi bi-facebook"></i></button>
          </div>
          <p class="help-text text-center text-light mb-0">
            Si vous n'avez pas de compte veuillez contactez un administrateur
          </p>
        </form>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
